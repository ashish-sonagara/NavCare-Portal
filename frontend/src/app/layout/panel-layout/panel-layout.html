<div class="shell">
  <aside class="side" [attr.aria-label]="title">
    <h2>{{ title }}</h2>
    <nav>
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
      }
    </nav>
  </aside>
  <main class="content"><router-outlet /></main>
</div>
